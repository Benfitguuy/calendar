<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我們的行事曆">
<meta name="theme-color" content="#E2EEFA">
<title>我們的行事曆</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v4.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=0.27.0">
</head>
<body class="th-day">
<div id="app">

  <!-- 頁面一：今天（時間軸） -->
  <div id="page-day" class="page">
    <header>
      <div class="top">
        <h1 id="month"></h1>
        <span id="sky"></span>
        <div class="top-btns">
          <button id="today" class="pill">今天</button>
          <button id="add" class="round" aria-label="新增行程">＋</button>
        </div>
      </div>
      <div class="week">
        <button id="prev" class="arrow" aria-label="上一週">‹</button>
        <div id="days"></div>
        <button id="next" class="arrow" aria-label="下一週">›</button>
      </div>
      <div class="colhead">
        <span></span>
        <span class="ch ben"><img class="av" src="icons/boy.svg" alt="">Ben</span>
        <span class="ch sarah"><img class="av" src="icons/girl.svg" alt="">Sarah</span>
        <span></span>
      </div>
    </header>

    <main id="scroller">
      <div id="grid">
        <div id="hours"></div>
        <div id="events"></div>
      </div>
    </main>

    <section id="tray">
      <div class="tray-head">
        <span><svg class="tray-plant" viewBox="0 0 20 22" aria-hidden="true"><path d="M5 14h10l-1.5 7h-7z" fill="#E8A87C"/><path d="M10 14 C9 9 5 8 3 9 C4 12 7 13 10 14 M10 14 C11 8 15 6 17 7 C16 11 13 13 10 14 M10 14 V6" stroke="#6EA55E" stroke-width="1.6" fill="#9CCD93" stroke-linejoin="round"/></svg>待安排 <b id="tcount"></b></span>
        <button id="addtodo" class="pill">＋ 新增</button>
      </div>
      <div id="chips"></div>
      <p class="tray-hint">按住待辦拖到上面就排好了；已排好的行程「久按」可以再移動</p>
    </section>
  </div>

  <!-- 頁面二：月曆＋經期 -->
  <div id="page-month" class="page" hidden>
    <header>
      <div class="top">
        <h1 id="m-title"></h1>
        <div class="top-btns">
          <button id="m-today" class="pill">回到本月</button>
        </div>
      </div>
    </header>
    <div class="mtabs"><button data-mode="events">行事曆</button><button data-mode="period">經期</button></div>
    <main class="mscroll">
      <div id="cycle-card"></div>
      <div class="mframe">
        <div class="mweek"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div id="mgrid"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div id="cycle-log" hidden></div>
      <div id="m-deco" class="mdeco" aria-hidden="true"></div>
      <p class="tray-hint" id="m-hint"></p>
    </main>
  </div>

  <!-- 頁面四：庫存＋採買清單 -->
  <div id="page-stock" class="page" hidden>
    <header>
      <div class="top">
        <h1>家裡庫存</h1>
        <div class="top-btns"><button id="stock-add" class="pill">＋ 新增</button></div>
      </div>
    </header>
    <div class="mtabs stabs mt3"><button data-tab="stock">庫存</button><button data-tab="shop">採買清單 <b id="shop-badge" class="badge"></b></button><button data-tab="log">購買紀錄</button></div>
    <main class="mscroll">
      <div id="stock-view"><div id="house" class="house"></div><div id="zchips" class="zchips"></div><div id="stock-list"></div>
        <p class="tray-hint">點房子裡的泡泡或上面的按鈕，只看那一區。用掉了按「−」，買了按「＋」。剩下的數量到提醒線（小黑線）就會自動加進採買清單。</p></div>
      <div id="shop-view" hidden>
        <form id="shop-form" class="shopadd"><input id="shop-input" placeholder="要買什麼？例如：牛奶"><button class="pill">加入</button></form>
        <div id="shop-list"></div>
      </div>
      <div id="log-view" hidden><div id="log-list"></div></div>
    </main>
  </div>

  <nav id="tabs">
    <button data-page="day" class="on"><span class="tico">◷</span>今天</button>
    <button data-page="month"><span class="tico">▦</span>月曆</button>
    <button data-page="stock"><span class="tico">☰</span>庫存</button>
  </nav>
</div>

<div id="sheetwrap" hidden><div id="sheet"></div></div>
<div id="preview" hidden></div>
<div id="toast"></div>

<script src="chars.js?v=0.27.0"></script><script src="app.js?v=0.27.0"></script>
</body>
</html>
